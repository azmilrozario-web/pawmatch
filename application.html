<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Application</title>
    <!-- Import Bootstrap 5's utility classes and components via its CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body class="bg-secondary bg-opacity-50">

    <!-- toast -->
    <!-- https://getbootstrap.com/docs/5.3/components/toasts/ -->
    <div class="toast-container p-3 top-0 start-50 translate-middle-x">
        <!-- Put toasts within -->
        <div id="msg-toast" class="toast align-items-center mt-2" role="alert" aria-live="assertive" aria-atomic="true"
            data-bs-autohide="true" data-bs-delay="4000">
            <div class="d-flex">
                <div id="msg-toast-body" class="toast-body">
                    <!-- Message to be added here -->
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- User navigation -->
    <header class="container-fluid py-3">
        <div class="d-flex justify-content-end align-items-center">
            <nav class="d-flex gap-5 me-5">
                <a href="index.html" class="nav-link fs-4 text-dark">Home</a>
                <a href="#" class="nav-link fs-4 text-dark">About</a>
                <a href="#" class="nav-link fs-4 text-dark">Contact</a>
                <a href="login.html" id="loginLink" class="nav-link fs-4 text-dark">Sign-in</a>
                <a href="#" id="logoutLink" class="nav-link fs-4 text-dark">Logout</a>
            </nav>

            <!-- Profile Container -->
            <div id="profileContainer" class="text-center pe-4">
                <div class="bg-secondary-subtle rounded-circle d-inline-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="gray" class="bi bi-person-fill"
                        viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                    </svg>
                </div>
                <p id="profileNameContainer" class="mb-0 fw-semibold pt-2" style="font-size: 0.8rem;">Welcome User</p>
            </div>
        </div>
    </header>

    <!-- Container for Update form -->
    <div class="container w-50 bg-secondary-subtle p-5 rounded-5 border border-light-subtle shadow-sm">

        <div>
            <h1 class="display-4 text-secondary fw-lighter text-center">
                Adoption Application
            </h1>
        </div>

        <form id="formUpdate" class="needs-validation" novalidate>

            <div class="row justify-content-center pb-3">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="txtReason">
                        Why would you like to adopt this pet?
                    </label>

                    <textarea id="txtReason" class="form-control" rows="6" required></textarea>

                    <div class="invalid-feedback text-danger">
                        Please tell us why you want to adopt this pet.
                    </div>
                </div>
            </div>

            <div class="text-center pt-4">
                <button class="btn btn-success btn-sm approveBtn" data-id="${application.id}">
                    Approve
                </button>
            </div>

        </form>

    </div>
    <!-- End of Container for Signup form -->

    <!-- Import Bootstrap 5's javascript library via its CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script/const.js"></script>
    <script src="script/auth.js"></script>
    <script src="script/components/Spinner.js"></script>
    <script src="script/loader.js"></script>

    <script src="script/boostrap-ftns.js"></script>
    <script src="script/form-validate.js"></script>

    <!-- Internal Custom Script -->
    <script>

        document.addEventListener("DOMContentLoaded", async (event) => {

            const reason = document.getElementById("txtReason");

            const toastElement = document.getElementById("msg-toast");              // Get the toast element - msg-toast
            const toastBodyElement = document.getElementById("msg-toast-body");     // Get the toast element - msg-toast-body

            const applicationStatus = window.location.href.match(/submitted=([^&]*)/);

            if (applicationStatus !== null) {
                if (applicationStatus[1] === "true") {
                    showToast({
                        toastElement,
                        toastBodyElement,
                        bgColor: "success",
                        msg: "Application submitted successfully."
                    });

                } else {
                    showToast({
                        toastElement,
                        toastBodyElement,
                        bgColor: "danger",
                        msg: "Unable to submit application."
                    });
                }
            }


            try {

                const token = isAuthenticated();

                if (!token) {
                    window.location = "login.html";
                }

            } catch (error) {
                showToast({
                    toastElement,
                    toastBodyElement,
                    bgColor: "danger",
                    msg: error.message
                });
            }

        });

        // Custom JS statements and function
        document.getElementById("formUpdate").addEventListener("submit", async (event) => {

            event.preventDefault();                                                 // Prevent default browser events from happening

            const reason = document.getElementById("txtReason");                     // Create constant variables to capture form inputs - txtReason

            const toastElement = document.getElementById("msg-toast");              // Get the toast element - msg-toast
            const toastBodyElement = document.getElementById("msg-toast-body");     // Get the toast element - msg-toast-body

            if (isEmpty(reason.value)) {     // Trap empty inputs for txtEmail and userName - isEmpty()
                showToast({
                    toastElement,
                    toastBodyElement,
                    bgColor: "danger",
                    msg: "Please enter a reason for adoption."
                });
                return;
            }

            // Application page does not need password or email validation

            spinner.createSpinner("btnSubmitApplication");                                     // Create the spinner, apply it to btnSubmitApplication
            spinner.displaySpinner(true);

            formData = {                                                            // prepare to update 
                reason: reason.value
            };

            // Application page does not need password or email validation

            const params = new URLSearchParams(window.location.search);
            const petId = params.get("pet");

            console.log("Pet ID:", petId);

            const applicationSuccess =
                await submitApplication(petId, formData);

            if (!applicationSuccess) {

                spinner.displaySpinner(false);

                showToast({
                    toastElement,
                    toastBodyElement,
                    bgColor: "danger",
                    msg: "Unable to submit application."
                });

                return;
            }

            showToast({
                toastElement,
                toastBodyElement,
                bgColor: "success",
                msg: "Application submitted successfully."
            });

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);

        });

    </script>
</body>

</html>
