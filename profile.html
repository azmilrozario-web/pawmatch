<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <!-- Import Bootstrap 5's utility classes and components via its CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body class="bg-secondary bg-opacity-50">

    <!-- toast -->
    <!-- https://getbootstrap.com/docs/5.3/components/toasts/ -->
    <div class="toast-container p-3 top-0 start-50 translate-middle-x">
        <!-- Put toasts within -->
        <div id="msg-toast" class="toast align-items-center mt-2" role="alert" aria-live="assertive" aria-atomic="true"
            data-bs-autohide="true" data-bs-delay="4000">
            <div class="d-flex">
                <div id="msg-toast-body" class="toast-body">
                    <!-- Message to be added here -->
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- User navigation -->
    <header class="container-fluid py-3">
        <div class="d-flex justify-content-end align-items-center">
            <nav class="d-flex gap-5 me-5">
                <a href="index.html" class="nav-link fs-4 text-dark">Home</a>
                <a href="#" class="nav-link fs-4 text-dark">About</a>
                <a href="#" class="nav-link fs-4 text-dark">Contact</a>
                <a href="login.html" id="loginLink" class="nav-link fs-4 text-dark">Sign-in</a>
                <a href="#" id="logoutLink" class="nav-link fs-4 text-dark">Logout</a>
            </nav>

            <!-- Profile Container -->
            <div id="profileContainer" class="text-center pe-4">
                <div class="bg-secondary-subtle rounded-circle d-inline-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="gray" class="bi bi-person-fill"
                        viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                    </svg>
                </div>
                <p id="profileNameContainer" class="mb-0 fw-semibold pt-2" style="font-size: 0.8rem;">Welcome User</p>
            </div>
        </div>
    </header>

    <!-- Container for Update form -->
    <div class="container w-50 bg-secondary-subtle p-5 rounded-5 border border-light-subtle shadow-sm">

        <div>
            <h1 class="display-4 text-secondary fw-lighter text-center">Update Profile</h1>
        </div>

        <form id="formUpdate" class="needs-validation" novalidate>

            <!-- FirstName input -->
            <div class="row justify-content-center pb-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="txtFirstName">FirstName:</label>
                    <input type="text" id="txtFirstName" class="form-control" required />
                    <div class="invalid-feedback text-danger">
                        Please enter your first name.
                    </div>
                </div>
            </div>

            <!-- LastName input -->
            <div class="row justify-content-center pb-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="txtLastName">LastName:</label>
                    <input type="text" id="txtLastName" class="form-control" required />
                    <div class="invalid-feedback text-danger">
                        Please enter your last name.
                    </div>
                </div>
            </div>

            <!-- phone input -->
            <div class="row justify-content-center pb-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="txtPhone">Phone:</label>
                    <input type="text" id="txtPhone" class="form-control" />
                </div>
            </div>

            <!-- Email input -->
            <div class="row justify-content-center pb-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="txtEmail">Email:</label>
                    <input type="email" id="txtEmail" class="form-control" required />
                    <div class="invalid-feedback text-danger">
                        Please enter a valid email.
                    </div>
                </div>
            </div>

            <!-- Address input -->
            <div class="row justify-content-center pb-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="txtAddress">
                        Address:
                    </label>

                    <input type="text" id="txtAddress" class="form-control" required />

                    <div class="invalid-feedback text-danger">
                        Please enter your address.
                    </div>
                </div>
            </div>

            <!-- Housing Type -->
            <div class="row justify-content-center pb-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="ddlHousingType">
                        Housing Type:
                    </label>

                    <select id="ddlHousingType" class="form-select" required>
                        <option value="">Select Housing Type</option>
                        <option value="HDB">HDB</option>
                        <option value="CONDOMINIUM">Condominium</option>
                        <option value="LANDED">Landed</option>
                    </select>

                    <div class="invalid-feedback text-danger">
                        Please select a housing type.
                    </div>
                </div>
            </div>


            <!-- Experience Level -->
            <div class="row justify-content-center pb-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="ddlExperienceLevel">
                        Pet Experience:
                    </label>

                    <select id="ddlExperienceLevel" class="form-select" required>
                        <option value="">Select Experience</option>
                        <option value="NONE">No Experience</option>
                        <option value="ONE_TO_THREE">1 to 3 Years</option>
                        <option value="MORE_THAN_THREE">More Than 3 Years</option>
                    </select>

                    <div class="invalid-feedback text-danger">
                        Please select your experience level.
                    </div>
                </div>
            </div>

            <!-- Password input -->
            <div class="row justify-content-center pt-2">
                <div class="col-10">
                    <label class="form-label text-secondary fw-normal" for="txtPassword">Password:</label>
                    <input type="password" id="txtPassword" class="form-control" />
                    <div class="invalid-feedback text-danger">
                        Please enter a password.
                    </div>
                    <div class="d-flex mt-2 justify-content-start align-items-center">
                        <input class="form-check-input mt-0" type="checkbox" id="checkPassword" value=""
                            aria-label="Checkbox for following text input">
                        <span class="ms-2 text-secondary small fw-light">Change password</span>
                    </div>
                </div>
            </div>

            <!-- Submit button -->
            <div class="d-flex justify-content-center pt-4">
                <button type="submit" id="btnUpdate" class="btn btn-danger btn-block ms-2">
                    Update
                </button>
                <button type="reset" id="btnReset" class="btn btn-secondary btn-block ms-2">Reset</button>
            </div>
        </form>

    </div>
    <!-- End of Container for Signup form -->

    <!-- Import Bootstrap 5's javascript library via its CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script/const.js"></script>
    <script src="script/auth.js"></script>
    <script src="script/components/Spinner.js"></script>
    <script src="script/loader.js"></script>

    <script src="script/boostrap-ftns.js"></script>
    <script src="script/form-validate.js"></script>

    <!-- Internal Custom Script -->
    <script>

        document.addEventListener("DOMContentLoaded", async (event) => {

            const firstName = document.getElementById("txtFirstName");                // Create constant variables to capture form inputs - txtUsername
            const lastName = document.getElementById("txtLastName");                // Create constant variables to capture form inputs - txtUsername
            const email = document.getElementById("txtEmail");                      // Create constant variables to capture form inputs - txtEmail
            const phone = document.getElementById("txtPhone");                      // Create constant variables to capture form inputs - txtPhone
            const address = document.getElementById("txtAddress");                  // Create constant variables to capture form inputs - txtAddress
            const pwd = document.getElementById("txtPassword");                     // Create constant variables to capture form inputs - txtPassword
            const housingType = document.getElementById("ddlHousingType");
            const experienceLevel = document.getElementById("ddlExperienceLevel");

            const toastElement = document.getElementById("msg-toast");              // Get the toast element - msg-toast
            const toastBodyElement = document.getElementById("msg-toast-body");     // Get the toast element - msg-toast-body

            const updateStatus = window.location.href.match(/updated=([^&]*)/);                 // Check if querystring updated is found

            if (updateStatus !== null)                                                           // If querystring is present, (profile is updated)
            {
                if (updateStatus[1] === "true") {
                    showToast({
                        toastElement,                                                    // Querystring updated is set to true
                        toastBodyElement,
                        bgColor: "success", msg: "Profile Updated."
                    });

                } else {                                                                          // Querystring updated is set to false
                    showToast({
                        toastElement,
                        toastBodyElement,
                        bgColor: "danger", msg: "Something went wrong. Try again."
                    });
                }
            }


            pwd.setAttribute("disabled", true);

            try {

                const token = isAuthenticated();

                if (!token) {
                    window.location = "index.html";
                }

                let response = await fetch(_ENDPOINT_PROFILE, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    const profile = await response.json();
                    firstName.value = profile.firstName;
                    lastName.value = profile.lastName;
                    phone.value = profile.phone == undefined ? "" : profile.phone; // if phone is undefined, set it to empty string, else set it to profile.phone
                    email.value = profile.email;
                    address.value = profile.address == undefined ? "" : profile.address; // if address is undefined, set it to empty string, else set it to profile.address
                    housingType.value = profile.housingType == undefined ? "" : profile.housingType;
                    experienceLevel.value = profile.experienceLevel == undefined ? "" : profile.experienceLevel;
                } else {
                    throw new Error("Unable to fetch data. Please try again.");
                }

            } catch (error) {
                showToast({ toastElement, toastBodyElement, bgColor: "danger", msg: error.message }); // If update fetch, provide feedback
            }

        });

        document.getElementById("checkPassword").addEventListener("click", () => {

            const pwd = document.getElementById("txtPassword");

            if (document.getElementById("checkPassword").checked) {
                pwd.removeAttribute("disabled");
                pwd.setAttribute("required", true);
                return;
            }
            pwd.value = null;
            pwd.setAttribute("disabled", true);
            pwd.removeAttribute("required");

        });

        // Custom JS statements and function
        document.getElementById("formUpdate").addEventListener("submit", async (event) => {

            event.preventDefault();                                                 // Prevent default browser events from happening

            const firstName = document.getElementById("txtFirstName");              // Create constant variables to capture form inputs - txtFirstName
            const lastName = document.getElementById("txtLastName");                // Create constant variables to capture form inputs - txtLastName
            const phone = document.getElementById("txtPhone");                      // Create constant variables to capture form inputs - txtPhone
            const email = document.getElementById("txtEmail");                      // Create constant variables to capture form inputs - txtEmail
            const address = document.getElementById("txtAddress");                  // Create constant variables to capture form inputs - txtAddress
            const housingType = document.getElementById("ddlHousingType");
            const experienceLevel = document.getElementById("ddlExperienceLevel");
            const pwd = document.getElementById("txtPassword");                     // Create constant variables to capture form inputs - txtPassword

            const toastElement = document.getElementById("msg-toast");              // Get the toast element - msg-toast
            const toastBodyElement = document.getElementById("msg-toast-body");     // Get the toast element - msg-toast-body

            if (isEmpty(firstName.value) || isEmpty(lastName.value) || isEmpty(email.value) || isEmpty(address.value) || isEmpty(housingType.value) || isEmpty(experienceLevel.value) ) {     // Trap empty inputs for txtEmail and userName - isEmpty()
                showToast({
                    toastElement,
                    toastBodyElement,
                    bgColor: "danger", msg: "All inputs must not be empty."
                });
                return;
            }

            if (document.getElementById("checkPassword").checked && isEmpty(pwd.value)) { // Trap txtPassword - isEmpty() when required
                showToast({
                    toastElement,
                    toastBodyElement,
                    bgColor: "danger", msg: "Password must not be empty."
                });
                return;
            }

            if (!isEmail(email.value)) {                                              // Trap invalid email for txtEmail - isEmail()
                showToast({
                    toastElement,
                    toastBodyElement,
                    bgColor: "danger", msg: "Email is invalid."
                });
                return;
            }

            spinner.createSpinner("btnUpdate");                                     // Create the spinner, apply it to btnUpdate
            spinner.displaySpinner(true);

            formData = {                                                            // prepare to update 
                firstName: firstName.value,
                lastName: lastName.value,
                phone: phone.value,
                email: email.value,
                address: address.value,
                housingType: housingType.value,
                experienceLevel: experienceLevel.value
            };

            if (document.getElementById("checkPassword").checked && !isEmpty(pwd.value)) {    // prepare to update password
                formData["password"] = pwd.value;
            }

            const updateSuccess = await updateProfile(formData);                    // Invoke updateProfile() function, and end (return)

            if (!updateSuccess) {
                spinner.displaySpinner(false);                                                                              // If update unsuccessful, hide spinner
                showToast({ toastElement, toastBodyElement, bgColor: "danger", msg: "Unable to update. Please try again." }); // If update unsuccessful, provide feedback
            }

        });

    </script>
</body>

</html>
