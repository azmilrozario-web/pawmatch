<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <!-- Import Bootstrap 5's utility classes and components via its CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body class="bg-secondary bg-opacity-50">

    <!-- toast -->
    <!-- https://getbootstrap.com/docs/5.3/components/toasts/ -->
    <div class="toast-container p-3 top-0 start-50 translate-middle-x">
        <!-- Put toasts within -->
        <div id="msg-toast" class="toast align-items-center mt-2" role="alert" aria-live="assertive" aria-atomic="true"
            data-bs-autohide="true" data-bs-delay="4000">
            <div class="d-flex">
                <div id="msg-toast-body" class="toast-body">
                    <!-- Message to be added here -->
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- User navigation -->
    <header class="container-fluid py-3">
        <div class="d-flex justify-content-end align-items-center">
            <nav class="d-flex gap-5 me-5">
                <a href="index.html" class="nav-link fs-4 text-dark">Home</a>
                <a href="#" class="nav-link fs-4 text-dark">About</a>
                <a href="#" class="nav-link fs-4 text-dark">Contact</a>
                <a href="login.html" id="loginLink" class="nav-link fs-4 text-dark">Sign-in</a>
                <a href="#" id="logoutLink" class="nav-link fs-4 text-dark">Logout</a>
            </nav>

            <!-- Profile Container -->
            <div id="profileContainer" class="text-center pe-4">
                <div class="bg-secondary-subtle rounded-circle d-inline-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="gray" class="bi bi-person-fill"
                        viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                    </svg>
                </div>
                <p id="profileNameContainer" class="mb-0 fw-semibold pt-2" style="font-size: 0.8rem;">Welcome User</p>
            </div>
        </div>
    </header>

    <!-- Container for Update form -->
    <div class="container w-50 bg-secondary-subtle p-5 rounded-5 border border-light-subtle shadow-sm">

        <div>
            <h1 class="display-4 text-secondary fw-lighter text-center">
                Admin Dashboard
            </h1>
        </div>

        <form id="formUpdate" class="needs-validation" novalidate>

            <div class="row justify-content-center pb-3">
                <div class="col-10">

                    <h3 class="text-center mb-4">
                        Adoption Applications
                    </h3>

                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Pet</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="applicationTableBody">
                            <!-- Applications will be loaded here -->
                        </tbody>
                    </table>


                    <hr class="my-5">

                    <h3 class="text-center mb-4">
                        Pet Management
                    </h3>

                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="petTableBody">
                        </tbody>
                    </table>


                </div>
            </div>
        </form>

    </div>
    <!-- End of Container for Signup form -->

    <!-- Import Bootstrap 5's javascript library via its CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script/const.js"></script>
    <script src="script/auth.js"></script>
    <script src="script/components/Spinner.js"></script>
    <script src="script/loader.js"></script>

    <script src="script/boostrap-ftns.js"></script>
    <script src="script/form-validate.js"></script>

    <!-- Internal Custom Script -->
    <script>

        document.addEventListener("DOMContentLoaded", async (event) => {

            const toastElement = document.getElementById("msg-toast");              // Get the toast element - msg-toast
            const toastBodyElement = document.getElementById("msg-toast-body");     // Get the toast element - msg-toast-body

            const updateStatus = window.location.href.match(/updated=([^&]*)/);                 // Check if querystring updated is found

            if (updateStatus !== null)                                                           // If querystring is present, (profile is updated)
            {
                if (updateStatus[1] === "true") {
                    showToast({
                        toastElement,                                                    // Querystring updated is set to true
                        toastBodyElement,
                        bgColor: "success", msg: "Profile Updated."
                    });

                } else {                                                                          // Querystring updated is set to false
                    showToast({
                        toastElement,
                        toastBodyElement,
                        bgColor: "danger", msg: "Something went wrong. Try again."
                    });
                }
            }


            try {

                const token = isAuthenticated();

                const applicationTableBody =
                    document.getElementById("applicationTableBody");

                const petTableBody =
                    document.getElementById("petTableBody");

                if (!token) {
                    window.location = "index.html";
                }

                applicationTableBody.innerHTML = `
                <tr>
                    <td>1</td>
                    <td>Demo User</td>
                    <td>Buddy</td>
                    <td>PENDING</td>
                    <td>
                        <button class="btn btn-success btn-sm approveBtn">
                            Approve
                        </button>
                    </td>
                </tr>
                `;

                let response = await fetch("http://localhost:8080/admin/all/applications", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                    },
                });

                if (response.ok) {

                    const applications = await response.json();

                    console.log(applications);

                    applicationTableBody.innerHTML = "";

                    applications.forEach((application) => {

                        applicationTableBody.innerHTML += `
                        <tr>
                            <td>${application.id}</td>
                            <td>${application.user.firstName}</td>
                            <td>${application.pet.name}</td>
                            <td>${application.approvalStatus}</td>
                            <td>
                            <button
                                class="btn btn-success btn-sm approveBtn"
                                data-id="${application.id}">
                                Approve
                            </button>

                            <button
                                class="btn btn-danger btn-sm rejectBtn"
                                data-id="${application.id}">
                                Reject
                            </button>
                            </td>
                        </tr>
                        `;

                    });

                    const approveButtons =
                        document.querySelectorAll(".approveBtn");

                    const rejectButtons =
                        document.querySelectorAll(".rejectBtn");

                    approveButtons.forEach((button) => {

                        button.addEventListener("click", async () => {

                            console.log("Approve button clicked");

                            const applicationId =
                                button.dataset.id;

                            const approveData = {
                                approvalStatus: "APPROVED"
                            };

                            const approveResponse = await fetch(
                                `http://localhost:8080/admin/application/${applicationId}`,
                                {
                                    method: "PUT",
                                    headers: {
                                        "Authorization": `Bearer ${token}`,
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify(approveData)
                                }
                            );

                            console.log(approveResponse.status);

                        });

                    });

                    rejectButtons.forEach((button) => {

                        button.addEventListener("click", async () => {

                            const applicationId =
                                button.dataset.id;

                            const rejectData = {
                                approvalStatus: "REJECTED"
                            };

                            const rejectResponse = await fetch(
                                `http://localhost:8080/admin/application/${applicationId}`,
                                {
                                    method: "PUT",
                                    headers: {
                                        "Authorization": `Bearer ${token}`,
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify(rejectData)
                                }
                            );

                            console.log(rejectResponse.status);

                        });

                    });


                    let petResponse = await fetch(
                        "http://localhost:8080/admin/all/pets",
                        {
                            method: "GET",
                            headers: {
                                "Authorization": `Bearer ${token}`,
                            },
                        }
                    );

                    if (petResponse.ok) {

                        const pets = await petResponse.json();

                        console.log(pets);

                        petTableBody.innerHTML = "";

                        pets.forEach((pet) => {

                            petTableBody.innerHTML += `
                        <tr>
                            <td>${pet.id}</td>
                            <td>${pet.name}</td>
                            <td>${pet.animalType}</td>
                            <td>${pet.adoptionStatus}</td>
                            <td>
                                <button
                                    class="btn btn-danger btn-sm deletePetBtn"
                                    data-id="${pet.id}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        `;
                        });

                        const deletePetButtons =
                            document.querySelectorAll(".deletePetBtn");

                        console.log(deletePetButtons);

                        deletePetButtons.forEach((button) => {

                            button.addEventListener("click", async () => {

                                try {

                                    const petId = button.dataset.id;

                                    alert("Delete pet id: " + petId);

                                    const deleteResponse = await fetch(
                                        `http://localhost:8080/admin/pet/${petId}`,
                                        {
                                            method: "DELETE",
                                            headers: {
                                                "Authorization": `Bearer ${token}`
                                            }
                                        }
                                    );

                                    alert("Status: " + deleteResponse.status);

                                } catch (error) {

                                    alert(error.message);

                                    console.log(error);

                                }

                            });

                        });

                    }

                } else {
                    throw new Error("Unable to fetch applications.");
                }

            } catch (error) {
                showToast({ toastElement, toastBodyElement, bgColor: "danger", msg: error.message }); // If update fetch, provide feedback
            }

        });


    </script>
</body>

</html>
