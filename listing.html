<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Import Bootstrap 5's utility classes and components via its CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Import fonts awesome stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">

    <!-- Import custom stylesheet -->
    <link rel="stylesheet" href="./listing-styles.css">


</head>
<!-- ! Homepage -->

<!-- Navigation bar -->

<body class="custom-bg-section vh-100">
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark custom-bg-nav border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img class="logoimage" src="./imgs/logo.svg" alt="Logo">
                <span class="fw-bold text-white logotext">
                    PawMatch
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Listings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#">About</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <i class="bi bi-person-circle fs-4"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Log in</a></li>
                            <li><a class="dropdown-item" href="#">Signup</a></li>
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Sign out</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex ps-2 pe-5" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
    </nav>

    <!-- Listings -->

    <main>
        <div class="container my-5">
            <div class="row">
                <!-- Filter Sidebar -->
                <aside class="col-md-3">
                    <h5>Filter</h5>
                    <!-- Species -->
                    <div class="mb-3">
                        <label for="species" class="form-label">Species</label>
                        <select id="species" class="form-select">
                            <option>All species</option>
                            <option>Dog</option>
                            <option>Cat</option>
                        </select>
                    </div>

                    <!-- Breed -->
                    <label for="breed">Breed</label>
                    <select id="breed" class="form-select mb-3">
                        <option>All breeds</option>
                        <option>Golden Retriever</option>
                        <option>German Shepherd</option>
                        <option>Poodle</option>
                        <option>French Bulldog</option>
                        <option>Dachshund</option>
                        <option>Maltese</option>
                        <option>Shih Tzu</option>
                    </select>

                    <!-- Age -->
                    <h5>Age</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="babies">
                        <label class="form-check-label" for="babies">Babies</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="young">
                        <label class="form-check-label" for="young">Young</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="adult">
                        <label class="form-check-label" for="adult">Adult</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="senior">
                        <label class="form-check-label" for="senior">Senior</label>
                    </div>

                    <!-- Gender -->

                    <h5>Gender</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="Male">
                        <label class="form-check-label" for="Male">Male</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="Female">
                        <label class="form-check-label" for="Female">Female</label>
                    </div>

                </aside>

                <!-- Listings Grid (right) -->
                <div class="col-md-9">
                    <div id="homeListing" class="row row-cols-1 row-cols-md-2 g-4">

                        <!-- Cards with images will be injected here by listing.js -->
                    </div>
                </div>
            </div>
    </main>



    <footer class="py-3 my-4">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Listings</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
        </ul>
        <p class="text-center text-body-secondary">&copy; 2026 PawMatch Ltd</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- Then load the listing logic -->
    <script src="./script/components/Spinner.js"></script>
    <script src="./script/data-listing.js"></script>
    <script src="./script/listing.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
